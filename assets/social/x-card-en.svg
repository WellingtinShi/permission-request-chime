<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Permission Request Chime social card</title>
  <desc id="desc">A promotional card for a Codex plugin that plays a chime when Codex asks for permission.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2026"/>
      <stop offset="1" stop-color="#101318"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#f6f3ee"/>
  <rect x="0" y="0" width="1600" height="900" fill="#111317"/>
  <path d="M0 680 C270 590 360 770 610 690 C870 606 1010 520 1600 608 L1600 900 L0 900 Z" fill="#1f2933" opacity="0.55"/>
  <path d="M0 776 C250 700 520 790 780 720 C1040 650 1270 660 1600 710 L1600 900 L0 900 Z" fill="#0f766e" opacity="0.18"/>

  <g transform="translate(86 88)">
    <rect x="0" y="0" width="560" height="330" rx="24" fill="url(#panel)" filter="url(#shadow)"/>
    <rect x="0" y="0" width="560" height="54" rx="24" fill="#20262d"/>
    <circle cx="36" cy="27" r="7" fill="#ef4444"/>
    <circle cx="62" cy="27" r="7" fill="#f59e0b"/>
    <circle cx="88" cy="27" r="7" fill="#22c55e"/>
    <text x="32" y="104" fill="#d1d5db" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">Codex is waiting...</text>
    <rect x="32" y="136" width="496" height="118" rx="16" fill="#0f1720" stroke="#334155" stroke-width="2"/>
    <text x="58" y="178" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="700">Permission request</text>
    <text x="58" y="218" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22">Codex needs your approval.</text>
    <rect x="360" y="272" width="92" height="42" rx="12" fill="#22c55e"/>
    <text x="383" y="300" fill="#052e16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="800">Allow</text>
    <rect x="462" y="272" width="66" height="42" rx="12" fill="#293241" stroke="#475569"/>
    <text x="482" y="300" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">Deny</text>
  </g>

  <g transform="translate(672 86)">
    <circle cx="138" cy="138" r="126" fill="#0f1720" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
    <path d="M94 144 C94 108 116 82 144 82 C172 82 194 108 194 144 L194 178 L218 205 L70 205 L94 178 Z" fill="#f8fafc"/>
    <path d="M118 218 C124 235 136 244 148 244 C160 244 172 235 178 218 Z" fill="#f59e0b"/>
    <path d="M228 82 C263 117 263 177 228 212" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round"/>
    <path d="M260 54 C311 105 311 189 260 240" fill="none" stroke="#22c55e" stroke-width="16" stroke-linecap="round"/>
    <path d="M62 82 C27 117 27 177 62 212" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round"/>
  </g>

  <g transform="translate(86 484)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="72" font-weight="800">Don't miss Codex</text>
    <text x="0" y="84" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="72" font-weight="800">permission requests</text>
    <text x="0" y="148" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34">Permission Request Chime plays a local sound when Codex is waiting for approval.</text>
  </g>

  <g transform="translate(86 754)">
    <rect x="0" y="0" width="1120" height="74" rx="18" fill="#0b1016" stroke="#334155" stroke-width="2"/>
    <text x="28" y="47" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="750">Open-source Codex plugin | Install command in thread</text>
    <text x="1160" y="47" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700">GitHub</text>
  </g>

  <text x="86" y="858" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24">github.com/WellingtinShi/permission-request-chime</text>
</svg>
