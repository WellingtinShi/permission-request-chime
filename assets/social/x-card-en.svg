<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Permission Request Chime v0.2.0 social card</title>
  <desc id="desc">A social card announcing macOS and Windows versions of a Codex permission request chime plugin.</desc>
  <rect width="1600" height="900" fill="#fafaf8"/>
  <line x1="96" y1="118" x2="1504" y2="118" stroke="#d4d4d2" stroke-width="2"/>
  <text x="96" y="84" fill="#737373" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" letter-spacing="6">PERMISSION REQUEST CHIME · V0.2.0</text>
  <text x="96" y="230" fill="#002fa7" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="4">CODEX PLUGIN</text>
  <text x="96" y="350" fill="#0a0a0a" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="112" font-weight="300">macOS</text>
  <text x="498" y="350" fill="#0a0a0a" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="112" font-weight="200">+</text>
  <text x="610" y="350" fill="#0a0a0a" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="112" font-weight="300">Windows</text>
  <text x="96" y="430" fill="#0a0a0a" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="400">A local chime when Codex waits for approval.</text>

  <g transform="translate(96 520)">
    <rect x="0" y="0" width="650" height="190" fill="#ffffff" stroke="#d4d4d2" stroke-width="2"/>
    <text x="40" y="58" fill="#002fa7" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" letter-spacing="4">MACOS</text>
    <text x="40" y="112" fill="#0a0a0a" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="500">permission-request-chime</text>
    <text x="40" y="158" fill="#737373" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30">/bin/sh + afplay Glass.aiff</text>
  </g>

  <g transform="translate(854 520)">
    <rect x="0" y="0" width="650" height="190" fill="#002fa7"/>
    <text x="40" y="58" fill="#ffffff" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" letter-spacing="4">WINDOWS</text>
    <text x="40" y="108" fill="#ffffff" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="500">permission-request-</text>
    <text x="40" y="152" fill="#ffffff" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="500">chime-windows</text>
  </g>

  <line x1="96" y1="790" x2="1504" y2="790" stroke="#d4d4d2" stroke-width="2"/>
  <text x="96" y="832" fill="#737373" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26">No OCR · No screen watching · Codex PermissionRequest hook</text>
  <text x="96" y="874" fill="#002fa7" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26">github.com/WellingtinShi/permission-request-chime</text>
</svg>
